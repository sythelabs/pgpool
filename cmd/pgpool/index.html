<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pgpool</title>
<style>
  :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1020; color: #e5e7eb; }
  body { margin: 0; background: radial-gradient(circle at top right, #1e3a5f, transparent 36rem), #0b1020; min-height: 100vh; }
  .shell { max-width: 1180px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 2rem; }
  h1, h2, h3, p { margin-top: 0; }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.06em; margin-bottom: .25rem; }
  h2 { font-size: 1.05rem; letter-spacing: .02em; margin-bottom: 1rem; }
  .eyebrow, .muted { color: #94a3b8; }
  .card { background: rgb(15 23 42 / .8); border: 1px solid #334155; border-radius: .85rem; box-shadow: 0 18px 45px rgb(0 0 0 / .2); padding: 1.25rem; margin-bottom: 1.25rem; }
  .up-form, .filters { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); align-items: end; }
  label { display: grid; color: #cbd5e1; font-size: .85rem; gap: .35rem; }
  input { box-sizing: border-box; min-width: 0; width: 100%; padding: .62rem .7rem; background: #0f172a; border: 1px solid #475569; border-radius: .45rem; color: inherit; font: inherit; }
  input:focus { outline: 2px solid #38bdf8; outline-offset: 2px; }
  .services { display: flex; flex-wrap: wrap; gap: .6rem; }
  .services label { display: flex; align-items: center; gap: .35rem; color: #e2e8f0; }
  .services input { width: auto; }
  button { cursor: pointer; color: #f8fafc; background: #0369a1; border: 1px solid #38bdf8; border-radius: .45rem; padding: .55rem .72rem; font: inherit; font-weight: 600; }
  button:hover { background: #0284c7; }
  button.secondary { background: #1e293b; border-color: #475569; }
  button.danger { background: #991b1b; border-color: #f87171; }
  button.danger:hover { background: #b91c1c; }
  .warning { color: #fcd34d; font-size: .88rem; margin: 1rem 0 0; }
  .notice { border-radius: .5rem; margin: 0 0 1rem; padding: .75rem .9rem; }
  .notice.success { background: #14532d; color: #dcfce7; }
  .notice.error { background: #7f1d1d; color: #fee2e2; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th { color: #94a3b8; font-size: .74rem; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
  th, td { border-bottom: 1px solid #334155; padding: .75rem .55rem; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .worktree { color: #f8fafc; font-weight: 650; }
  .service { color: #7dd3fc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .state { border-radius: 999px; display: inline-block; font-size: .75rem; font-weight: 700; padding: .16rem .48rem; text-transform: uppercase; }
  .state.running { background: #14532d; color: #bbf7d0; }
  .state.stopped { background: #78350f; color: #fde68a; }
  .state.missing { background: #334155; color: #cbd5e1; }
  .endpoints { display: grid; gap: .25rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; }
  a { color: #7dd3fc; }
  .actions { display: flex; flex-wrap: wrap; gap: .4rem; }
  .actions form { margin: 0; }
  .details td { background: #020617; }
  pre { background: #020617; border: 1px solid #334155; border-radius: .45rem; max-height: 25rem; overflow: auto; padding: .75rem; white-space: pre-wrap; }
  .empty { color: #94a3b8; padding: 1.5rem .5rem; text-align: center; }
  @media (max-width: 650px) { .shell { padding: 1.25rem .8rem 2rem; } header { display: block; } }
</style>
<script src="/assets/htmx-2.0.10.min.js" defer></script>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <p class="eyebrow">ephemeral worktree services</p>
      <h1>pgpool</h1>
    </div>
    <p class="muted">A small control plane for your local containers.</p>
  </header>

  <section class="card" aria-labelledby="up-title">
    <h2 id="up-title">Bring up services</h2>
    <form class="up-form" action="/ui/up" method="post" hx-post="/ui/up" hx-target="#dashboard" hx-swap="outerHTML">
      <label>Repository <input name="repo" required autocomplete="off" placeholder="warlock"></label>
      <label>Worktree <input name="worktree" required autocomplete="off" placeholder="feature-x"></label>
      <label>Postgres image override <input name="image" autocomplete="off" placeholder="pgvector/pgvector:pg18"></label>
      <div>
        <label>Services</label>
        <div class="services">
          <label><input type="checkbox" name="services" value="postgres"> postgres</label>
          <label><input type="checkbox" name="services" value="seaweedfs"> seaweedfs</label>
          <label><input type="checkbox" name="services" value="fake-gcs"> fake-gcs</label>
        </div>
      </div>
      <button type="submit">Up</button>
    </form>
    <p class="warning">Leave services unchecked to use the server default. Reload and Down permanently delete this worktree service's volume.</p>
  </section>

  <main id="dashboard" hx-get="/ui/dashboard" hx-trigger="load, every 15s" hx-swap="outerHTML" aria-live="polite">
    <section class="card"><p class="empty">Loading managed worktrees…</p></section>
  </main>
</div>
</body>
</html>
