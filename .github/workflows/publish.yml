name: publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/release.yml

  release:
    name: publish release
    needs: build
    runs-on: >-
      ${{ fromJSON(github.repository == 'sythelabs/pgpool' &&
      github.event.repository.private &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      '["self-hosted","ci"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Prepare job-private tool home
        run: |
          set -euo pipefail
          tool_home="$RUNNER_TEMP/tool-home"
          mkdir -p "$tool_home/.config"
          printf 'HOME=%s\nXDG_CONFIG_HOME=%s\n' "$tool_home" "$tool_home/.config" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum pgpool-*.tar.gz pgpool-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/pgpool-*.tar.gz dist/pgpool-*.zip dist/SHA256SUMS
